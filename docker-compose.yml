# version: '3.8'
services:
  amanat-finance-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: amanat_finance_be
    restart: unless-stopped
    working_dir: /var/www
    volumes:
      - .:/var/www
    depends_on:
      - db
    networks:
      - psc-network

  web:
    image: nginx:alpine
    container_name: amanat_finance_api
    restart: unless-stopped
    ports:
      - "8002:80"
    volumes:
      - .:/var/www
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - amanat-finance-app
    networks:
      - psc-network

networks:
  psc-network:
    external: true

volumes:
  dbdata:
    driver: local